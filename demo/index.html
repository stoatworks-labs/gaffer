  <body>
    <main id="demo">
      <noscript>
        <h1>gaffer</h1>
        <p>
          A simulated lens on a depth map, with the music holding the camera: an
          FFGL effect for Resolume and an OpenFX plugin for Resolve. One plane
          of the picture is sharp and everything else is a disc sized by its
          distance from that plane, with a camera rig that rings to the kick and
          a focus puller working two marks on the barrel.
        </p>
        <p>
          This demo runs the plugin's shader in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/gaffer">its repository</a>.
        </p>
