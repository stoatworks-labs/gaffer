name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
#
# This also gives Dependabot bumps something to be gated on: without a
# pull_request trigger anywhere they arrive with no status check and simply
# accumulate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # VERTIGO_BUILD_TOOLS is ON here where the release build turns it OFF:
        # vgtest is a large slice of the C++ and carries the only independent
        # implementation of the depth solve, so compiling it is most of the
        # value of this job.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVERTIGO_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The measurements themselves are NOT run here, and the reason is not
      # that they are slow. Hosted macOS runners have no GPU, so vgtest would
      # fall back to a software context or fail to make one at all — and a
      # number measured off llvmpipe is not evidence about the shader that
      # ships. tools/verify.sh is a local step, on a real machine, and the
      # honest place to say so is here.
      - name: Verify the shader compiles and the plugin registers
        run: |
          set -euo pipefail
          binary="build/Vertigo.bundle/Contents/MacOS/Vertigo"
          symbols=$(nm -gU "$binary")
          case "$symbols" in
            *_plugMain*) echo "ok: plugMain exported" ;;
            *) echo "expected _plugMain, got: $symbols"; exit 1 ;;
          esac
          literals=$(strings "$binary")
          case "$literals" in
            *VG01*) echo "ok: registration survived the link" ;;
            *) echo "VG01 not in the binary — the registration TU was dropped"; exit 1 ;;
          esac

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: vertigo-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
