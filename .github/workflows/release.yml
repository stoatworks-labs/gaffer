name: release

# Build the Gaffer plugin for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) Gaffer.bundle
#   - Windows -> x64 Gaffer.dll (GLEW static-linked via vcpkg)
# Each ships as a zip; drop the bundle/dll into Resolume's "Extra Effects"
# folder. The OpenFX build ships as its own zip alongside, because it installs
# to the OFX folder rather than Resolume's.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
# A workflow_dispatch run builds everything and publishes nothing -- the release
# job is gated on refs/tags/v* -- which makes it the cheap way to prove the
# Windows build still compiles without cutting anything.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # --- macOS: no extra deps, universal build straight from CMake ---
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGAFFER_BUILD_TOOLS=OFF

      # --- Windows: GLEW comes from vcpkg, static-linked (static-md keeps the
      #     CRT dynamic so the plugin matches the host) so the .dll has no
      #     external glew32.dll runtime dependency. ---
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DGAFFER_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Gaffer.bundle" "out/Gaffer.bundle"
            lipo -archs "out/Gaffer.bundle/Contents/MacOS/Gaffer"
            # Actions runs `shell: bash` as `bash -eo pipefail`, so `cmd | grep -q X`
            # FAILS when grep FINDS its match: grep exits at once, the writer takes
            # SIGPIPE, and pipefail reports the pipeline as failed -- failing the
            # release on a correct binary. It is output-size dependent, so it bites
            # the biggest artefact first. Captured and matched with `case` instead.
            __symbols=$( nm -gU "out/Gaffer.bundle/Contents/MacOS/Gaffer" )
            case "$__symbols" in
              *_plugMain*) ;;
              *) echo "expected _plugMain, got: $__symbols"; exit 1 ;;
            esac
            # The registration is a file-scope constructor nothing names, so a
            # linker that dropped its translation unit would still produce a
            # loadable bundle that reports it contains no plugins.
            __literals=$( strings "out/Gaffer.bundle/Contents/MacOS/Gaffer" )
            case "$__literals" in
              *GF01*) ;;
              *) echo "GF01 missing: the registration was dropped"; exit 1 ;;
            esac
          else
            cp "build/Release/Gaffer.dll" "out/Gaffer.dll"
          fi
          # OpenFX build: shipped as its own zip, not folded into the FFGL
          # artefact — it installs to the OFX folder, not Resolume's.
          mkdir -p ofxout
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Gaffer.ofx.bundle" "ofxout/Gaffer.ofx.bundle"
            lipo -archs "ofxout/Gaffer.ofx.bundle/Contents/MacOS/Gaffer.ofx"
            __ofx=$( nm -gU "ofxout/Gaffer.ofx.bundle/Contents/MacOS/Gaffer.ofx" )
            case "$__ofx" in
              *_OfxGetPlugin*) ;;
              *) echo "expected _OfxGetPlugin"; exit 1 ;;
            esac
            # If cmake/InfoOFX.plist.in ever names an executable that is not
            # there, this is where it surfaces -- as "code object is not signed
            # at all / In subcomponent", which mentions no plist. tools/verify.sh
            # runs the same step locally so it cannot reach a tag.
            codesign --force --sign - --timestamp=none "ofxout/Gaffer.ofx.bundle"
          else
            mkdir -p "ofxout/Gaffer.ofx.bundle/Contents/Win64"
            cp "build/Gaffer.ofx.bundle/Contents/Win64/Gaffer.ofx" "ofxout/Gaffer.ofx.bundle/Contents/Win64/Gaffer.ofx"
          fi
          ls -R ofxout
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../gaffer-${{ matrix.name }}.zip" ./*
          else
            zip -r "../gaffer-${{ matrix.name }}.zip" ./*
          fi
          cd ../ofxout
          if command -v 7z >/dev/null 2>&1; then
            7z a "../gaffer-ofx-${{ matrix.name }}.zip" ./*
          else
            zip -r "../gaffer-ofx-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific — the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects — so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users. Mounting an image and dragging the bundle where the
        # README says is the honest shape here.
        run: |
          source scripts/release-lib.sh
          rl_init "Gaffer" gaffer "${{ steps.ver.outputs.version }}" \
            com.stoatworks.gaffer "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Gaffer.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gaffer-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to the common FFGL
    # folder but stays editable, because Resolume reads plugins from a path the
    # user chooses per edition.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Gaffer" gaffer "$version" com.stoatworks.gaffer "$PWD/installers"
          zip="$(find artifacts -name "gaffer-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --cli: a plugin has no executable to make a shortcut to.
          rl_nsis windows-x86_64 "$stage" --cli
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: gaffer-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
